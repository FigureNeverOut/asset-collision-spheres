[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-collision-spheres"
version = "0.1.0"
description = "Experimental material-aware collision sphere generation for triangle meshes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "trimesh>=4.11.1", "rtree>=1.2"]

[project.optional-dependencies]
usd = ["usd-core>=24.5"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
asset-spheres = "asset_collision_spheres.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
