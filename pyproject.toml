[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-collision-spheres"
version = "0.1.1"
description = "Experimental material-aware collision sphere generation for triangle meshes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "trimesh>=4.11.1", "rtree>=1.2"]

[project.optional-dependencies]
usd = ["usd-core>=24.5"]
workspace = ["PyYAML>=6"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
asset-spheres = "asset_collision_spheres.cli:main"
asset-spheres-preview = "asset_collision_spheres.preview.mesh:main"

[tool.setuptools]
packages = [
  "asset_collision_spheres", "asset_collision_spheres.algorithms",
  "asset_collision_spheres.geometry", "asset_collision_spheres.loaders",
  "asset_collision_spheres.preview", "asset_collision_spheres.adapters",
  "asset_collision_spheres.adapters.workspace", "asset_collision_spheres.configs",
]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"asset_collision_spheres.configs" = "configs"

[tool.setuptools.package-data]
"asset_collision_spheres.configs" = ["demo/*.json", "mug/*.json", "bowl/*.json", "box/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
